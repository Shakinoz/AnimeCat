<button [type]="type()" class="btn" [class]="'btn--' + variant() + ' btn--' + size()" [class.disabled]="disabled()"
  [class.swipe]="swipe()" [disabled]="disabled()" [attr.aria-disabled]="disabled()">
  @if (icon()) {
  <mat-icon>{{ icon() }}</mat-icon>
  }
  @if (label()) {
  <span class="btn__label">{{ label() }}</span>
  }
</button>
