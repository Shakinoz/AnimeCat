<div class="pagination-controls">
  <button class="pagination-btn" (click)="onPrev()" [disabled]="currentPage() === 1">
    Précédent
  </button>
  <span class="page-info">Page {{ currentPage() }}</span>
  <button class="pagination-btn" (click)="onNext()" [disabled]="!hasNext()">Suivant</button>
</div>
