name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app for project pages
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback and nojekyll
        run: |
          cp dist/AnimeCat_TFE/browser/index.html dist/AnimeCat_TFE/browser/404.html
          touch dist/AnimeCat_TFE/browser/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/AnimeCat_TFE/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
